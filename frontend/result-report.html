<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation Report - Global Exams</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/enhanced-style.css">
</head>
<body>
    <div class="bg-mesh"></div>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">Global Exams</div>
            <ul class="navbar-menu">
                <li><a href="/results.html" class="btn btn-secondary" style="color:var(--text-secondary)">Back</a></li>
                <li><a href="/dashboard.html" class="btn btn-secondary" style="color:var(--text-secondary)">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="padding-top: 2rem;">
        <div class="glass-card" style="margin-bottom: 1.5rem;">
            <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start;">
                <div>
                    <h1 style="margin:0;">Evaluation Report</h1>
                    <p id="report-meta" style="margin:0.5rem 0 0;color:var(--text-secondary);">Loading…</p>
                </div>
                <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                    <button class="btn btn-secondary" onclick="downloadJson()">Download JSON</button>
                    <button class="btn btn-primary" onclick="downloadHtml()">Download Report</button>
                </div>
            </div>
        </div>

        <section class="glass-card" style="margin-bottom: 1.5rem;">
            <h2 style="margin-top:0;">Summary</h2>
            <div id="summary-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-top:1rem;"></div>
            <div id="malpractice-box" style="margin-top:1rem;"></div>
        </section>

        <section class="glass-card" style="margin-bottom: 1.5rem;">
            <h2 style="margin-top:0;">Score Breakdown</h2>
            <div id="breakdown" style="margin-top:1rem;"></div>
        </section>

        <section class="glass-card">
            <h2 style="margin-top:0;">Per-Question Evaluation</h2>
            <div id="per-question" style="margin-top:1rem;"></div>
        </section>
    </main>

    <script src="/src/js/api.legacy.js"></script>
    <script>
        const api = new APIClient();
        let reportData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!localStorage.getItem('token')) {
                window.location.href = '/login.html';
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const examId = params.get('examId');
            const studentId = params.get('studentId');
            if (!examId) {
                window.location.href = '/results.html';
                return;
            }

            try {
                reportData = await api.getResultReport(examId, studentId);
                renderReport(reportData);
            } catch (e) {
                document.getElementById('report-meta').textContent = 'Failed to load report.';
            }
        });

        function renderReport(data) {
            const meta = [];
            meta.push(`Exam: ${data.exam?.title || 'N/A'}`);
            if (data.student?.name) {
                meta.push(`Student: ${data.student.name}`);
            }
            if (data.submittedAt) {
                meta.push(`Submitted: ${new Date(data.submittedAt).toLocaleString()}`);
            }
            if (data.gradedAt) {
                meta.push(`Graded: ${new Date(data.gradedAt).toLocaleString()}`);
            }
            document.getElementById('report-meta').textContent = meta.join(' • ');

            const summary = document.getElementById('summary-grid');
            const timeTaken = data.timeTakenSeconds != null
                ? `${Math.round(data.timeTakenSeconds / 60)} min`
                : 'N/A';

            summary.innerHTML = [
                metricCard('Score', `${data.totalScore}/${data.totalMarks}`),
                metricCard('Percentage', `${(data.percentage || 0).toFixed(1)}%`),
                metricCard('Time Taken', timeTaken),
                metricCard('Questions', `${data.perQuestion?.length || 0}`)
            ].join('');

            const malpracticeBox = document.getElementById('malpractice-box');
            const flags = data.malpractice?.flags || [];
            const violations = data.malpractice?.violations || 0;
            if (violations > 0) {
                malpracticeBox.innerHTML = `
                    <div style="background: rgba(239,68,68,0.1); padding: 1rem; border-radius: 8px;">
                        <strong>Malpractice Flags:</strong> ${violations}
                        <ul style="margin-top:0.5rem;">
                            ${flags.map(f => `<li>${escapeHtml(f.reason)} (${new Date(f.timestamp).toLocaleTimeString()})</li>`).join('')}
                        </ul>
                    </div>
                `;
            } else {
                malpracticeBox.innerHTML = `
                    <div style="background: rgba(16,185,129,0.1); padding: 1rem; border-radius: 8px;">
                        <strong>Malpractice Flags:</strong> None detected.
                    </div>
                `;
            }

            const breakdown = document.getElementById('breakdown');
            if (!data.breakdown || data.breakdown.length === 0) {
                breakdown.innerHTML = '<p style="color:var(--text-secondary);">No unit/topic tags available.</p>';
            } else {
                breakdown.innerHTML = data.breakdown.map(item => `
                    <div class="glass-card" style="margin-bottom:0.75rem;">
                        <div style="display:flex;justify-content:space-between;gap:1rem;align-items:center;">
                            <div>
                                <strong>${escapeHtml(item.unit)}</strong>
                                <div style="color:var(--text-secondary);font-size:0.9rem;">${escapeHtml(item.topic)}</div>
                            </div>
                            <div style="font-weight:bold;">${item.score}/${item.maxScore}</div>
                        </div>
                    </div>
                `).join('');
            }

            const perQuestion = document.getElementById('per-question');
            perQuestion.innerHTML = (data.perQuestion || []).map((q, idx) => `
                <div class="glass-card" style="margin-bottom:1rem;">
                    <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
                        <div style="flex:1;">
                            <div style="color:var(--text-secondary);font-size:0.9rem;">
                                Q${idx + 1} • ${q.type} • ${q.unit} / ${q.topic}
                            </div>
                            <div style="margin:0.5rem 0;white-space:pre-wrap;">${escapeHtml(q.questionText)}</div>
                            <div style="color:var(--text-secondary);font-size:0.9rem;">Expected: ${formatExpected(q.expectedAnswer)}</div>
                            <div style="color:var(--text-secondary);font-size:0.9rem;">Submitted: ${escapeHtml(q.submittedAnswer || '')}</div>
                        </div>
                        <div style="text-align:right;min-width:140px;">
                            <div style="font-weight:bold;">${q.score}/${q.maxScore}</div>
                            <div class="status-badge ${statusBadge(q.status)}">${q.status}</div>
                            <div style="color:var(--text-secondary);font-size:0.85rem;margin-top:0.5rem;">
                                Method: ${escapeHtml(q.evaluationMethod || 'pending')}
                            </div>
                        </div>
                    </div>
                    ${renderTestCases(q.testCases)}
                    ${q.feedback ? `<div style="margin-top:0.5rem;color:var(--text-secondary);"><strong>Feedback:</strong> ${escapeHtml(q.feedback)}</div>` : ''}
                </div>
            `).join('');
        }

        function renderTestCases(testCases) {
            if (!testCases || testCases.length === 0) return '';
            return `
                <div style="margin-top:0.75rem;">
                    <strong>Testcases</strong>
                    <ul style="margin-top:0.5rem;">
                        ${testCases.map(tc => `<li>${escapeHtml(tc.input || '')} => ${escapeHtml(tc.expectedOutput || '')} (${tc.weight || 1})</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        function metricCard(label, value) {
            return `
                <div style="background: rgba(59,130,246,0.1); padding: 1rem; border-radius: 8px; text-align: center;">
                    <div style="font-size: 1.6rem; font-weight: bold; color: var(--accent-primary);">${value}</div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">${label}</div>
                </div>
            `;
        }

        function statusBadge(status) {
            if (status === 'Correct') return 'bg-active';
            if (status === 'Partial') return 'bg-draft';
            return 'bg-inactive';
        }

        function formatExpected(expected) {
            if (Array.isArray(expected)) return expected.map(escapeHtml).join(', ');
            return escapeHtml(expected || 'N/A');
        }

        function downloadJson() {
            if (!reportData) return;
            const blob = new Blob([JSON.stringify(reportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            triggerDownload(url, 'evaluation-report.json');
        }

        function downloadHtml() {
            if (!reportData) return;
            const html = document.documentElement.outerHTML;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            triggerDownload(url, 'evaluation-report.html');
        }

        function triggerDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
