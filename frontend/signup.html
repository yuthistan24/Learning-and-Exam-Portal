<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Global Exams & Learning</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/enhanced-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-mesh"></div>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">Global Exams</div>
            <ul class="navbar-menu">
                <li>
                    <button class="theme-toggle" onclick="api.toggleTheme()" title="Toggle Light/Dark Mode">
                        <i class="fas fa-sun"></i>
                    </button>
                </li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="container auth-wrapper">
        <div class="glass-card auth-box">
            <h2>Create Account</h2>
            <p class="subtitle">Join the next generation of learning.</p>
            
            <form onsubmit="handleRegisterSubmit(event)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@university.edu" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="new-password">
                    <small style="color: var(--text-secondary); margin-top: 0.25rem; display: block;">
                        Min 8 characters, include uppercase, lowercase, number
                    </small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="role">Select Role</label>
                    <select id="role" required>
                        <option value="student">Student</option>
                    </select>
                    <small style="color: var(--text-secondary); margin-top: 0.25rem; display: block;">
                        Teacher and admin accounts are created by administrators.
                    </small>
                </div>

                <div id="error-msg" style="display:none; background:rgba(239,68,68,0.15); border:1px solid #EF4444; color:#EF4444; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.9rem;"></div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Create Account</button>
            </form>

            <div class="auth-link">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </main>

    <script src="src/js/api.legacy.js"></script>
    <script>
        const api = new APIClient();

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-msg').style.display = 'none';
        }

        function validatePassword(pwd) {
            if (pwd.length < 8) return 'Password must be at least 8 characters';
            if (!/[A-Z]/.test(pwd)) return 'Password must contain uppercase letter';
            if (!/[a-z]/.test(pwd)) return 'Password must contain lowercase letter';
            if (!/[0-9]/.test(pwd)) return 'Password must contain a number';
            return null;
        }

        async function handleRegisterSubmit(event) {
            event.preventDefault();
            hideError();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const btn = document.getElementById('submit-btn');

            // Validation
            if (!name || !email || !password || !confirmPassword || !role) {
                showError('All fields are required');
                return;
            }

            const pwdError = validatePassword(password);
            if (pwdError) {
                showError(pwdError);
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            try {
                btn.textContent = 'Creating Account...';
                btn.disabled = true;
                await api.register(email, password, name, role);
                window.location.href = 'dashboard.html';
            } catch (error) {
                showError('Registration failed: ' + (error.message || 'Could not connect to server'));
                btn.textContent = 'Create Account';
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('token')) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
