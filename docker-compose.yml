# version: '3.8'  # obsolete in Docker Compose v2

services:
  # MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: global-exams-db
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: global-exams
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mongo Express - Web UI for database browsing
  mongo-express:
    image: mongo-express:latest
    container_name: global-exams-db-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: global-exams-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/global-exams
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-before-production}
      PYTHON_SERVICE_URL: http://python-service:8000
      ALLOWED_ORIGINS: http://localhost:80,http://localhost,http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
      backend-seed:
        condition: service_completed_successfully
    networks:
      - app-network
    volumes:
      - ./backend/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: global-exams-seed
    restart: on-failure
    command: ["npm", "run", "seed"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/global-exams
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-before-production}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin12345}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  # Python Evaluator Service
  python-service:
    build:
      context: ./python-evaluator
      dockerfile: Dockerfile
    container_name: global-exams-evaluator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DEBUG: "False"
      LOG_LEVEL: INFO
      LLM_PROVIDER: ollama
      LLM_API_KEY: ""
      LLM_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      TRANSFORMERS_OFFLINE: "True"
      HF_HUB_OFFLINE: "1"
      HF_HOME: /app/models
      MODEL_CACHE_DIR: /app/models
    networks:
      - app-network
    volumes:
      - ./python-evaluator/app:/app/app
    depends_on:
      ollama:
        condition: service_started

  # Local Ollama (no API keys, no HF downloads)
  ollama:
    image: ollama/ollama:latest
    container_name: global-exams-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network

  # Nginx Reverse Proxy & Frontend Server
  nginx:
    image: nginx:alpine
    container_name: global-exams-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      python-service:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  ollama_data:
    driver: local
