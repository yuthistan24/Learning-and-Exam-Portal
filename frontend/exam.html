<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctored Exam - Global Exams</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/enhanced-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="src/js/api.legacy.js"></script>
    <script src="src/js/proctor.js"></script>
    <script src="src/js/app.js"></script>
</head>
<body style="background-color: var(--bg-primary);">
    <div class="bg-mesh"></div>

    <main class="container exam-window">
        <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">Global Exams</div>
            <ul class="navbar-menu">
                <li>
                    <button class="theme-toggle" onclick="api.toggleTheme()" title="Toggle Light/Dark Mode">
                        <i class="fas fa-sun"></i>
                    </button>
                </li>
                <li><span id="user-display" style="color:var(--text-secondary); font-size:0.9rem;">Loading...</span></li>
            </ul>
        </div>
    </nav>
        <!-- Exam Interface -->
        <div id="exam-section">
            <div class="exam-header">
                <h2 id="exam-title">Loading Exam Environment...</h2>
                <div class="exam-timer" id="exam-timer">00:00</div>
            </div>
            
            <div id="questions-container" class="questions-container">
                <!-- Javascript will populate questions here dynamically -->
            </div>
            
            <div class="exam-footer">
                <button onclick="submitExam(false)" class="btn btn-primary" style="font-size: 1.1rem; padding: 1rem 3rem;">Submit Exam</button>
            </div>
        </div>

        <!-- Results Display Overlay -->
        <div id="results-section" class="hidden">
            <div class="glass-card" style="margin-top: 3rem;">
                <h2>Exam Complete</h2>
                <div id="results-container" style="margin-top: 2rem;">
                    <!-- Auto-graded results inserted here -->
                </div>
                <div style="text-align: center; margin-top: 2rem;">
                    <a href="/dashboard.html" class="btn btn-primary">Return to Dashboard</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetExamId = urlParams.get('id');
            
            if (!localStorage.getItem('token') || !targetExamId) {
                window.location.href = 'login.html';
                return;
            }

            // Start standard exam protocol from app.js
            startExam(targetExamId).catch(err => {
                alert("Failed to securely load exam env: " + err.message);
                window.location.href = 'dashboard.html';
            });
        });
    </script>
</body>
</html>
