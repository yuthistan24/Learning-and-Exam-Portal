<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Global Exams & Learning</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/enhanced-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-mesh"></div>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">Global Exams</div>
            <ul class="navbar-menu">
                <li>
                    <button class="theme-toggle" onclick="api.toggleTheme()" title="Toggle Light/Dark Mode">
                        <i class="fas fa-sun"></i>
                    </button>
                </li>
                <li><a href="/login.html">Login</a></li>
                <li><a href="/signup.html" class="btn btn-primary" style="color:white">Get Started</a></li>
            </ul>
        </div>
    </nav>

    <main class="container auth-wrapper">
        <div class="glass-card auth-box">
            <h2>Welcome Back</h2>
            <p class="subtitle">Enter your credentials to access the portal.</p>

            <div style="display:flex; gap:0.5rem; margin-bottom:2rem; background:rgba(255,255,255,0.05); padding:0.4rem; border-radius:12px;">
                <button onclick="setLoginRole('student')" id="role-btn-student" style="flex:1; border:none; background:var(--accent-primary); color:white; padding:0.6rem; border-radius:8px; cursor:pointer; font-weight:600; font-size:0.85rem; transition:0.3s;">Student</button>
                <button onclick="setLoginRole('teacher')" id="role-btn-teacher" style="flex:1; border:none; background:transparent; color:var(--text-secondary); padding:0.6rem; border-radius:8px; cursor:pointer; font-weight:600; font-size:0.85rem; transition:0.3s;">Teacher</button>
                <button onclick="setLoginRole('admin')" id="role-btn-admin" style="flex:1; border:none; background:transparent; color:var(--text-secondary); padding:0.6rem; border-radius:8px; cursor:pointer; font-weight:600; font-size:0.85rem; transition:0.3s;">Admin</button>
            </div>
            
            <form onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@university.edu" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                
                <div id="error-msg" style="display:none; background:rgba(239,68,68,0.15); border:1px solid #EF4444; color:#EF4444; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.9rem;"></div>
                
                <button type="submit" id="submit-btn" class="btn btn-primary">Sign In</button>
            </form>

            <div class="auth-link">
                Don't have an account? <a href="/signup.html">Sign up</a>
            </div>
        </div>
    </main>

    <script src="/src/js/api.legacy.js"></script>
    <script>
        const api = new APIClient();

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function setLoginRole(role) {
            const roles = ['student', 'teacher', 'admin'];
            roles.forEach(r => {
                const btn = document.getElementById(`role-btn-${r}`);
                if (r === role) {
                    btn.style.background = 'var(--accent-primary)';
                    btn.style.color = 'white';
                } else {
                    btn.style.background = 'transparent';
                    btn.style.color = 'var(--text-secondary)';
                }
            });
            // We can pre-fill emails for demo purposes if needed
            const emailMap = {
                student: 'student@college.edu',
                teacher: 'teacher@college.edu',
                admin: 'admin@college.edu'
            };
            document.getElementById('email').value = emailMap[role] || '';
        }

        async function handleLoginSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            document.getElementById('error-msg').style.display = 'none';
            
            try {
                btn.textContent = 'Authenticating...';
                btn.disabled = true;
                await api.login(email, password);
                window.location.href = '/dashboard.html';
            } catch (error) {
                showError('Login failed: ' + (error.message || 'Could not connect to server. Is the backend running?'));
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        }
        
        // Auto-redirect if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('token')) {
                window.location.href = '/dashboard.html';
            }
        });
    </script>
</body>
</html>
