<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Exams - Online Learning Platform</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div id="app"></div>
    
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-brand">Global Exams</h1>
            <ul class="navbar-menu" id="navbar-menu">
                <li><button onclick="logout()" class="btn">Logout</button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container" id="main-content">
        <!-- Auth Section -->
        <div id="auth-section" class="auth-container">
            <div class="auth-box">
                <h2 id="auth-title">Login</h2>
                <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Name (for signup)</label>
                        <input type="text" id="name" name="name">
                    </div>
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" name="role">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleAuthForm()">Sign Up</button>
                </form>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden">
            <!-- Student Dashboard -->
            <div id="student-dashboard" class="hidden">
                <h2>Available Exams</h2>
                <div id="exams-list" class="exams-grid">
                    <!-- Exams will be loaded here -->
                </div>
            </div>

            <!-- Teacher Dashboard -->
            <div id="teacher-dashboard" class="hidden">
                <h2>My Exams</h2>
                <button onclick="showCreateExamForm()" class="btn btn-primary">Create Exam</button>
                <div id="teacher-exams-list" class="exams-grid">
                    <!-- Exams will be loaded here -->
                </div>

                <!-- Create/Edit Exam Modal -->
                <div id="create-exam-modal" class="modal hidden">
                    <div class="modal-content">
                        <h3 id="modal-exam-title">Create New Exam</h3>
                        <form id="create-exam-form" onsubmit="handleCreateExamSubmit(event)">
                            <div class="form-group">
                                <label for="exam-title-input">Title</label>
                                <input type="text" id="exam-title-input" required>
                            </div>
                            <div class="form-group">
                                <label for="exam-desc-input">Description</label>
                                <textarea id="exam-desc-input" required></textarea>
                            </div>
                            <div class="form-group">
                                <label for="exam-duration-input">Duration (minutes)</label>
                                <input type="number" id="exam-duration-input" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Save Exam</button>
                            <button type="button" class="btn btn-secondary" onclick="closeModal('create-exam-modal')">Cancel</button>
                        </form>
                    </div>
                </div>

                <!-- Edit Exam Details / Questions Modal -->
                <div id="edit-exam-modal" class="modal hidden">
                    <div class="modal-content" style="max-width: 600px;">
                        <h3>Edit Exam Questions</h3>
                        <div id="existing-questions-list"></div>
                        <hr>
                        <h4>Add New Question</h4>
                        <form id="add-question-form" onsubmit="handleAddQuestionSubmit(event)">
                            <div class="form-group">
                                <label>Question Type</label>
                                <select id="q-type-input" onchange="toggleOptionFields()">
                                    <option value="mcq">Multiple Choice</option>
                                    <option value="short_answer">Short Answer</option>
                                    <option value="long_answer">Long Answer</option>
                                    <option value="math">Math</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Question Text</label>
                                <textarea id="q-text-input" required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Marks</label>
                                <input type="number" id="q-marks-input" value="1" min="1" required>
                            </div>
                            <div class="form-group">
                                <label>Expected Answer(s) (Comma Separated)</label>
                                <input type="text" id="q-expected-input" required>
                            </div>
                            <div id="mcq-options-container" class="form-group">
                                <label>MCQ Options (Comma Separated)</label>
                                <input type="text" id="q-options-input">
                            </div>
                            <button type="submit" class="btn btn-primary">Add Question</button>
                            <button type="button" class="btn btn-secondary" onclick="closeModal('edit-exam-modal')">Close</button>
                        </form>
                    </div>
                </div>

                <!-- Teacher Results Modal -->
                <div id="teacher-results-modal" class="modal hidden">
                    <div class="modal-content" style="max-width: 800px;">
                        <h3>Exam Results</h3>
                        <div id="teacher-results-container"></div>
                        <button class="btn btn-secondary" onclick="closeModal('teacher-results-modal')" style="margin-top: 20px;">Close</button>
                    </div>
                </div>
            </div>

            <!-- Exam Taking -->
            <div id="exam-section" class="hidden">
                <div class="exam-header">
                    <h2 id="exam-title"></h2>
                    <div class="timer" id="exam-timer"></div>
                </div>
                <div id="questions-container">
                    <!-- Questions will be loaded here -->
                </div>
                <div class="exam-footer">
                    <button onclick="submitExam()" class="btn btn-primary">Submit Exam</button>
                </div>
            </div>

            <!-- Results -->
            <div id="results-section" class="hidden">
                <h2>Your Results</h2>
                <div id="results-container">
                    <!-- Results will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <script src="src/js/api.js"></script>
    <script src="src/js/proctor.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
