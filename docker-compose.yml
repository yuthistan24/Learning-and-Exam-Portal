services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://opreman589_db_user:gZdPdsZVxgdHZJ27@examproctoringsystem.gsoscsp.mongodb.net/global-exams?retryWrites=true&w=majority&appName=ExamProctoringSystem
      - JWT_SECRET=your-super-secret-key-change-in-production
      - PYTHON_SERVICE_URL=http://python-evaluator:8000
